<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Site - CMS Example</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        .hero { text-align: center; padding: 50px 20px; background: #f4f4f4; }
        .images { display: flex; justify-content: space-around; margin-top: 20px; }
        .images img { width: 23%; height: auto; border-radius: 8px; }
        footer { margin-top: 50px; text-align: center; padding: 10px; border-top: 1px solid #ccc; }
        /* Simple CSS for demonstration. You would use a separate 'style.css' in a real project. */
    </style>
</head>
<body>

    <header class="hero">
        <h1>Welcome to the Doctor Site</h1>
        <p>Managed with Decap CMS</p>
    </header>

    <main>
        <h2>Our Facility</h2>
        <p>This is where content managed by the CMS will eventually appear. For now, here are the images you specified:</p>

        <div class="images">
            <img src="img1.jpg" alt="Facility Image 1">
            <img src="img2.jpg" alt="Facility Image 2">
            <img src="img3.jpg" alt="Facility Image 3">
            <img src="img4.jpg" alt="Facility Image 4">
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Doctor Site.</p>
        <p>
            <a href="/admin/" style="color: blue; text-decoration: none;">Go to Admin (CMS) Panel</a>
        </p>
    </footer>

</body>
</html>
